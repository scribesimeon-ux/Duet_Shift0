[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duetshift"
version = "0.1.0"
description = "DuetShift development foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["duetshift*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
